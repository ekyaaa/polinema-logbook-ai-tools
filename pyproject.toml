[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "polinema-logbook-generator"
version = "0.1.0"
description = "Polinema Monthly Internship Logbook Generator based on Git Evidence"
readme = "IMPLEMENTATION_PLAN.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    "python-dateutil>=2.8.0",
]

[project.scripts]
logbook = "scripts.logbook.cli:main"
